<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8-Day Gym Fitness Program</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f1117;
      color: #f5f5f5;
      padding: 16px;
      line-height: 1.5;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.55rem;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #b8b8b8;
      font-size: 0.9rem;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 10;
      background: #0f1117;
      padding: 10px 0;
      margin-bottom: 12px;
    }

    .tabs button {
      border: 1px solid #343a52;
      background: #1c2030;
      color: white;
      padding: 10px 4px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .tabs button.active {
      background: #4f7cff;
      border-color: #4f7cff;
    }

    .day {
      display: none;
    }

    .day.active {
      display: block;
    }

    .day-title {
      font-size: 1.25rem;
      margin: 14px 0;
    }

    details {
      background: #181b27;
      border: 1px solid #2b3042;
      border-radius: 16px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    summary {
      background: #202536;
      padding: 14px;
      font-weight: bold;
      cursor: pointer;
      list-style: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .content {
      padding: 14px;
    }

    .exercise {
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #30364a;
    }

    .exercise:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .exercise-name {
      font-weight: bold;
      color: white;
    }

    .sets {
      color: #bfc7ff;
      font-size: 0.95rem;
      margin-top: 3px;
    }

    .cooldown {
      background: #111827;
      border: 1px solid #2d3748;
      border-radius: 16px;
      padding: 14px;
      margin: 16px 0 28px;
    }

    .cooldown h3 {
      margin-bottom: 8px;
    }

    .cooldown ul {
      padding-left: 20px;
      color: #d5d5d5;
    }
  </style>
</head>
<body>
  <header>
    <h1>8-Day Gym Fitness Program</h1>
    <p class="subtitle">Full Body • Gym • لياقة / Fitness Focus</p>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="app"></main>

  <script>
    const workouts = [
      {
        title: "DAY 1 — FULL BODY START",
        warmup: [
          "Treadmill Incline Walk — 15-20 min",
          "Arm Circles — 30 sec each direction",
          "Band Pull-Aparts — 2 x 15",
          "Bodyweight Squats — 2 x 12",
          "Walking Lunges — 1 x 8 each leg",
          "Light Machine Chest Press — 1 x 15",
          "Light Lat Pulldown — 1 x 15"
        ],
        supersets: [
          ["Back + Biceps", ["Lat Pulldown — 4 x 10-12", "Dumbbell Curls — 4 x 10-12"]],
          ["Chest + Triceps", ["Machine Chest Press — 4 x 10-12", "Rope Tricep Pushdown — 4 x 12-15"]],
          ["Shoulders + Upper Legs", ["Dumbbell Shoulder Press — 4 x 10-12", "Leg Press — 4 x 12-15"]],
          ["Lower Legs + Abs", ["Standing Calf Raise Machine — 4 x 15-20", "Cable Crunches — 4 x 12-15"]]
        ],
        cooldown: [
          "Bike — 5-8 min easy pace",
          "Chest Stretch — 45 sec each side",
          "Lat Stretch — 45 sec each side",
          "Quad Stretch — 45 sec each side",
          "Hamstring Stretch — 45 sec each side",
          "Deep Breathing — 1 min"
        ]
      },
      {
        title: "DAY 2 — FITNESS BASE",
        warmup: [
          "Bike — 18-22 min",
          "Shoulder Circles — 30 sec each direction",
          "Hip Circles — 30 sec each direction",
          "Bodyweight Good Mornings — 2 x 12",
          "Incline Pushups — 2 x 8-10",
          "Light Seated Row — 1 x 15",
          "Light Leg Extension — 1 x 15"
        ],
        supersets: [
          ["Back + Biceps", ["Seated Cable Row — 4 x 10-12", "Hammer Curls — 4 x 10-12"]],
          ["Chest + Triceps", ["Incline Dumbbell Press — 4 x 10-12", "Assisted Dip Machine / Bench Dips — 4 x 8-12"]],
          ["Shoulders + Upper Legs", ["Machine Shoulder Press — 4 x 10-12", "Goblet Squat — 4 x 10-12"]],
          ["Lower Legs + Abs", ["Seated Calf Raise — 4 x 15-20", "Captain's Chair Knee Raises — 4 x 10-15"]]
        ],
        cooldown: [
          "Treadmill Walk — 5-10 min easy pace",
          "Shoulder Cross-Body Stretch — 45 sec each side",
          "Hip Flexor Stretch — 45 sec each side",
          "Calf Stretch — 45 sec each side",
          "Seated Hamstring Stretch — 45 sec each side",
          "Breathing Reset — 1 min"
        ]
      },
      {
        title: "DAY 3 — CARDIO AND STRENGTH",
        warmup: [
          "Elliptical — 20-25 min",
          "Band Pull-Aparts — 2 x 15",
          "Scapular Pulldown Practice — 1 x 12 light",
          "Pushups on Bench — 2 x 8",
          "Bodyweight Squats — 2 x 12",
          "Light Hamstring Curl — 1 x 15",
          "Light Cable Face Pull — 1 x 15"
        ],
        supersets: [
          ["Back + Biceps", ["Assisted Pullups / Lat Pulldown — 4 x 8-12", "EZ-Bar Curls — 4 x 10-12"]],
          ["Chest + Triceps", ["Cable Chest Fly — 4 x 12-15", "Overhead Cable Tricep Extension — 4 x 12-15"]],
          ["Shoulders + Upper Legs", ["Cable Lateral Raises — 4 x 12-15", "Lying Hamstring Curl — 4 x 10-15"]],
          ["Lower Legs + Abs", ["Calf Press on Leg Press — 4 x 15-20", "Plank — 4 x 30-45 sec"]],
          ["Full Body Fitness", ["Farmer Walks — 4 x 25-35 sec", "Step-Ups — 4 x 8 each leg"]]
        ],
        cooldown: [
          "Bike — 6-8 min easy pace",
          "Lat Stretch — 45 sec each side",
          "Doorway Chest Stretch — 45 sec each side",
          "Figure-4 Glute Stretch — 45 sec each side",
          "Hamstring Stretch — 45 sec each side",
          "Deep Breathing — 1 min"
        ]
      },
      {
        title: "DAY 4 — EASY CONDITIONING",
        warmup: [
          "Treadmill Walk/Jog Intervals — 20 min",
          "Ankle Circles — 30 sec each side",
          "Knee Hugs — 1 x 10 each side",
          "Arm Swings — 30 sec",
          "Wall Pushups — 2 x 12",
          "Light Row Machine — 1 x 15",
          "Light Leg Press — 1 x 15"
        ],
        supersets: [
          ["Back + Biceps", ["Chest-Supported Row Machine — 4 x 10-12", "Alternating Dumbbell Curls — 4 x 10-12"]],
          ["Chest + Triceps", ["Machine Chest Press — 4 x 10-12", "Cable Tricep Pushdown — 4 x 12-15"]],
          ["Shoulders + Upper Legs", ["Dumbbell Lateral Raises — 4 x 12-15", "Leg Extension Machine — 4 x 12-15"]],
          ["Lower Legs + Abs", ["Standing Calf Raises — 4 x 15-20", "Dead Bug — 4 x 10 each side"]]
        ],
        cooldown: [
          "Elliptical — 5-8 min very easy",
          "Chest Stretch — 45 sec each side",
          "Quad Stretch — 45 sec each side",
          "Calf Stretch — 45 sec each side",
          "Child's Pose — 60 sec",
          "Breathing Reset — 1 min"
        ]
      },
      {
        title: "DAY 5 — STRENGTH BASICS",
        warmup: [
          "Stairmaster — 10-15 min easy/moderate",
          "Treadmill Walk — 5-10 min",
          "Band Pull-Aparts — 2 x 15",
          "Bodyweight Squats — 2 x 12",
          "Incline Pushups — 2 x 8-10",
          "Light Lat Pulldown — 1 x 15",
          "Light Dumbbell Shoulder Press — 1 x 12"
        ],
        supersets: [
          ["Back + Biceps", ["Lat Pulldown — 4 x 8-12", "Reverse Curls — 4 x 10-12"]],
          ["Chest + Triceps", ["Dumbbell Bench Press — 4 x 8-12", "Rope Pushdowns — 4 x 10-15"]],
          ["Shoulders + Upper Legs", ["Machine Shoulder Press — 4 x 8-12", "Leg Press — 4 x 10-12"]],
          ["Lower Legs + Abs", ["Seated Calf Raises — 4 x 15-20", "Machine Crunch / Cable Crunch — 4 x 12-15"]],
          ["Posture + Core", ["Cable Face Pulls — 4 x 12-15", "Pallof Press — 4 x 10 each side"]]
        ],
        cooldown: [
          "Treadmill Walk — 6-10 min easy pace",
          "Lat Stretch — 45 sec each side",
          "Pec Stretch — 45 sec each side",
          "Hip Flexor Stretch — 45 sec each side",
          "Hamstring Stretch — 45 sec each side",
          "Controlled Breathing — 1 min"
        ]
      },
      {
        title: "DAY 6 — FAT LOSS CIRCUIT",
        warmup: [
          "Rowing Machine — 12-15 min",
          "Bike — 8-10 min",
          "Arm Circles — 30 sec each direction",
          "Hip Circles — 30 sec each direction",
          "Bodyweight Squats — 2 x 12",
          "Bench Pushups — 2 x 8-10",
          "Light Cable Row — 1 x 15",
          "Light Calf Raises — 1 x 20"
        ],
        supersets: [
          ["Back + Biceps", ["Seated Cable Row — 4 x 10-12", "Dumbbell Hammer Curls — 4 x 10-12"]],
          ["Chest + Triceps", ["Incline Machine Press — 4 x 10-12", "Assisted Dip Machine — 4 x 8-12"]],
          ["Shoulders + Upper Legs", ["Cable Lateral Raises — 4 x 12-15", "Walking Lunges — 4 x 8 each leg"]],
          ["Lower Legs + Abs", ["Calf Press Machine — 4 x 15-20", "Hanging Knee Raises / Captain's Chair — 4 x 10-15"]],
          ["Conditioning Finisher", ["Sled Push / Battle Ropes — 4 x 20-30 sec", "Bodyweight Squats — 4 x 12"]]
        ],
        cooldown: [
          "Bike — 5-8 min very easy",
          "Shoulder Stretch — 45 sec each side",
          "Quad Stretch — 45 sec each side",
          "Hamstring Stretch — 45 sec each side",
          "Calf Stretch — 45 sec each side",
          "Deep Breathing — 1 min"
        ]
      },
      {
        title: "DAY 7 — UPPER BODY FITNESS",
        warmup: [
          "Elliptical — 15-20 min",
          "Treadmill Incline Walk — 5-10 min",
          "Band Pull-Aparts — 2 x 15",
          "Cable Face Pulls Light — 1 x 15",
          "Incline Pushups — 2 x 10",
          "Light Lat Pulldown — 1 x 15",
          "Bodyweight Lunges — 1 x 8 each leg",
          "Dead Bug — 1 x 10 each side"
        ],
        supersets: [
          ["Back + Biceps", ["Assisted Pullups / Neutral Lat Pulldown — 4 x 8-12", "EZ-Bar Curls — 4 x 10-12"]],
          ["Chest + Triceps", ["Pushups / Machine Chest Press — 4 x 8-12", "Cable Tricep Pushdowns — 4 x 12-15"]],
          ["Shoulders + Upper Legs", ["Dumbbell Shoulder Press — 4 x 10-12", "Goblet Squats — 4 x 10-12"]],
          ["Lower Legs + Abs", ["Standing Calf Raises — 4 x 15-20", "Russian Twists — 4 x 16-20 total"]],
          ["Posture Work", ["Rear Delt Machine Fly — 4 x 12-15", "Farmer Carries — 4 x 25-35 sec"]]
        ],
        cooldown: [
          "Treadmill Walk — 5-8 min easy",
          "Chest Stretch — 45 sec each side",
          "Lat Stretch — 45 sec each side",
          "Forearm Stretch — 30 sec each side",
          "Hip Flexor Stretch — 45 sec each side",
          "Breathing Reset — 1 min"
        ]
      },
      {
        title: "DAY 8 — FULL BODY RESET",
        warmup: [
          "Bike or Treadmill — 20-30 min steady",
          "Easy Row Machine — 3 min",
          "Shoulder Circles — 30 sec each direction",
          "Bodyweight Squats — 2 x 12",
          "Wall Slides — 2 x 10",
          "Light Seated Row — 1 x 15",
          "Light Leg Press — 1 x 15"
        ],
        supersets: [
          ["Back + Biceps", ["Wide-Grip Lat Pulldown — 4 x 10-12", "Dumbbell Curls — 4 x 10-12"]],
          ["Chest + Triceps", ["Incline Dumbbell Press — 4 x 10-12", "Overhead Rope Extension — 4 x 12-15"]],
          ["Shoulders + Upper Legs", ["Machine Lateral Raise — 4 x 12-15", "Leg Press — 4 x 12-15"]],
          ["Lower Legs + Abs", ["Seated Calf Raises — 4 x 15-20", "Cable Crunch — 4 x 12-15"]],
          ["Core Stability", ["Pallof Press — 4 x 10 each side", "Plank — 4 x 30-45 sec"]]
        ],
        cooldown: [
          "Elliptical — 5-10 min easy",
          "Full Chest Stretch — 45 sec each side",
          "Lat Stretch — 45 sec each side",
          "Quad Stretch — 45 sec each side",
          "Hamstring Stretch — 45 sec each side",
          "Calf Stretch — 45 sec each side",
          "Deep Breathing — 1-2 min"
        ]
      }
    ];

    const tabs = document.getElementById("tabs");
    const app = document.getElementById("app");

    workouts.forEach((workout, index) => {
      const button = document.createElement("button");
      button.textContent = "Day " + (index + 1);
      if (index === 0) button.classList.add("active");
      button.onclick = () => showDay(index);
      tabs.appendChild(button);

      const section = document.createElement("section");
      section.className = "day" + (index === 0 ? " active" : "");

      section.innerHTML = `
        <h2 class="day-title">${workout.title}</h2>

        <div class="cooldown">
          <h3>Warmup</h3>
          <ul>${workout.warmup.map(item => `<li>${item}</li>`).join("")}</ul>
        </div>

        ${workout.supersets.map((superset, supersetIndex) => `
          <details>
            <summary>Superset ${supersetIndex + 1} — ${superset[0]}</summary>
            <div class="content">
              ${superset[1].map(exercise => {
                const parts = exercise.split(" — ");
                return `
                  <div class="exercise">
                    <div class="exercise-name">${parts[0]}</div>
                    <div class="sets">${parts[1] || ""}</div>
                  </div>
                `;
              }).join("")}
            </div>
          </details>
        `).join("")}

        <div class="cooldown">
          <h3>Cooldown</h3>
          <ul>${workout.cooldown.map(item => `<li>${item}</li>`).join("")}</ul>
        </div>
      `;

      app.appendChild(section);
    });

    function showDay(index) {
      document.querySelectorAll(".day").forEach((day, i) => {
        day.classList.toggle("active", i === index);
      });

      document.querySelectorAll(".tabs button").forEach((button, i) => {
        button.classList.toggle("active", i === index);
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  </script>
</body>
</html>
