<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8-Day Gym Split Program</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f1117;
      color: #f5f5f5;
      padding: 16px;
      line-height: 1.5;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.55rem;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #b8b8b8;
      font-size: 0.9rem;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 10;
      background: #0f1117;
      padding: 10px 0;
      margin-bottom: 12px;
    }

    .tabs button {
      border: 1px solid #343a52;
      background: #1c2030;
      color: white;
      padding: 10px 4px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .tabs button.active {
      background: #4f7cff;
      border-color: #4f7cff;
    }

    .day {
      display: none;
    }

    .day.active {
      display: block;
    }

    .day-title {
      font-size: 1.25rem;
      margin: 14px 0;
    }

    details {
      background: #181b27;
      border: 1px solid #2b3042;
      border-radius: 16px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    summary {
      background: #202536;
      padding: 14px;
      font-weight: bold;
      cursor: pointer;
      list-style: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .content {
      padding: 14px;
    }

    .exercise {
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #30364a;
    }

    .exercise:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .exercise-name {
      font-weight: bold;
      color: white;
    }

    .sets {
      color: #bfc7ff;
      font-size: 0.95rem;
      margin-top: 3px;
    }

    .cooldown {
      background: #111827;
      border: 1px solid #2d3748;
      border-radius: 16px;
      padding: 14px;
      margin: 16px 0 28px;
    }

    .cooldown h3 {
      margin-bottom: 8px;
    }

    .cooldown ul {
      padding-left: 20px;
      color: #d5d5d5;
    }
  </style>
</head>
<body>
  <header>
    <h1>8-Day Gym Split Program</h1>
    <p class="subtitle">Gym • Bodybuilding Style • لياقة / Fitness Focus</p>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="app"></main>

  <script>
    const workouts = [
      {
        title: "DAY 1 — CHEST + TRICEPS",
        warmup: [
          "Treadmill Incline Walk — 12-18 min",
          "Arm Circles — 30 sec each direction",
          "Band Pull-Aparts — 2 x 15",
          "Incline Pushups — 2 x 8-10",
          "Light Machine Chest Press — 1 x 15",
          "Light Rope Pushdown — 1 x 15"
        ],
        supersets: [
          ["Chest + Triceps", ["Machine Chest Press — 4 x 10-12", "Rope Tricep Pushdown — 4 x 12-15"]],
          ["Chest + Triceps", ["Incline Dumbbell Press — 4 x 10-12", "Overhead Cable Tricep Extension — 4 x 12-15"]],
          ["Chest + Triceps", ["Cable Chest Fly — 4 x 12-15", "Assisted Dip Machine / Bench Dips — 4 x 8-12"]],
          ["Core + Fitness", ["Cable Crunch — 4 x 12-15", "Treadmill Fast Walk — 4 x 60 sec"]]
        ],
        cooldown: [
          "Bike — 5-8 min easy pace",
          "Chest Stretch — 45 sec each side",
          "Triceps Stretch — 45 sec each side",
          "Shoulder Stretch — 45 sec each side",
          "Deep Breathing — 1 min"
        ]
      },
      {
        title: "DAY 2 — BACK + BICEPS",
        warmup: [
          "Elliptical — 12-18 min",
          "Shoulder Circles — 30 sec each direction",
          "Band Pull-Aparts — 2 x 15",
          "Scapular Pulldown Practice — 1 x 12 light",
          "Light Lat Pulldown — 1 x 15",
          "Light Dumbbell Curls — 1 x 15"
        ],
        supersets: [
          ["Back + Biceps", ["Lat Pulldown — 4 x 10-12", "Dumbbell Curls — 4 x 10-12"]],
          ["Back + Biceps", ["Seated Cable Row — 4 x 10-12", "Hammer Curls — 4 x 10-12"]],
          ["Back + Biceps", ["Chest-Supported Row Machine — 4 x 10-12", "EZ-Bar Curls — 4 x 10-12"]],
          ["Core + Fitness", ["Captain's Chair Knee Raises — 4 x 10-15", "Farmer Walks — 4 x 25-35 sec"]]
        ],
        cooldown: [
          "Treadmill Walk — 5-8 min easy pace",
          "Lat Stretch — 45 sec each side",
          "Biceps Stretch — 30 sec each side",
          "Forearm Stretch — 30 sec each side",
          "Breathing Reset — 1 min"
        ]
      },
      {
        title: "DAY 3 — LEGS + ABS",
        warmup: [
          "Bike — 12-18 min",
          "Hip Circles — 30 sec each direction",
          "Ankle Circles — 30 sec each side",
          "Bodyweight Squats — 2 x 12",
          "Walking Lunges — 1 x 8 each leg",
          "Light Leg Press — 1 x 15"
        ],
        supersets: [
          ["Upper Legs", ["Leg Press — 4 x 12-15", "Lying Hamstring Curl — 4 x 10-15"]],
          ["Upper Legs", ["Goblet Squat — 4 x 10-12", "Leg Extension Machine — 4 x 12-15"]],
          ["Lower Legs + Abs", ["Standing Calf Raise Machine — 4 x 15-20", "Cable Crunch — 4 x 12-15"]],
          ["Abs + Fitness", ["Plank — 4 x 30-45 sec", "Treadmill Incline Walk — 4 x 60 sec"]]
        ],
        cooldown: [
          "Bike — 5-8 min easy pace",
          "Quad Stretch — 45 sec each side",
          "Hamstring Stretch — 45 sec each side",
          "Calf Stretch — 45 sec each side",
          "Hip Flexor Stretch — 45 sec each side",
          "Deep Breathing — 1 min"
        ]
      },
      {
        title: "DAY 4 — SHOULDERS + ARMS",
        warmup: [
          "Rowing Machine — 10-15 min easy/moderate",
          "Arm Circles — 30 sec each direction",
          "Band Pull-Aparts — 2 x 15",
          "Light Cable Face Pull — 1 x 15",
          "Light Dumbbell Shoulder Press — 1 x 12",
          "Light Rope Pushdown — 1 x 15"
        ],
        supersets: [
          ["Shoulders + Arms", ["Machine Shoulder Press — 4 x 10-12", "EZ-Bar Curls — 4 x 10-12"]],
          ["Shoulders + Arms", ["Dumbbell Lateral Raises — 4 x 12-15", "Cable Tricep Pushdown — 4 x 12-15"]],
          ["Shoulders + Arms", ["Rear Delt Machine Fly — 4 x 12-15", "Hammer Curls — 4 x 10-12"]],
          ["Abs + Fitness", ["Russian Twists — 4 x 16-20 total", "Battle Ropes / Bike Sprint — 4 x 20 sec"]]
        ],
        cooldown: [
          "Treadmill Walk — 5-8 min easy pace",
          "Shoulder Cross-Body Stretch — 45 sec each side",
          "Triceps Stretch — 45 sec each side",
          "Biceps Stretch — 30 sec each side",
          "Deep Breathing — 1 min"
        ]
      },
      {
        title: "DAY 5 — PUSH DAY",
        warmup: [
          "Treadmill Incline Walk — 15-20 min",
          "Arm Swings — 30 sec",
          "Band Pull-Aparts — 2 x 15",
          "Incline Pushups — 2 x 10",
          "Light Machine Shoulder Press — 1 x 15",
          "Light Machine Chest Press — 1 x 15"
        ],
        supersets: [
          ["Chest + Shoulders", ["Incline Machine Press — 4 x 10-12", "Dumbbell Shoulder Press — 4 x 10-12"]],
          ["Chest + Triceps", ["Flat Dumbbell Press — 4 x 10-12", "Rope Pushdowns — 4 x 12-15"]],
          ["Shoulders + Triceps", ["Cable Lateral Raises — 4 x 12-15", "Overhead Rope Extension — 4 x 12-15"]],
          ["Abs + Fitness", ["Cable Crunch — 4 x 12-15", "Bike Moderate Push — 4 x 60 sec"]]
        ],
        cooldown: [
          "Elliptical — 5-8 min easy pace",
          "Chest Stretch — 45 sec each side",
          "Shoulder Stretch — 45 sec each side",
          "Triceps Stretch — 45 sec each side",
          "Controlled Breathing — 1 min"
        ]
      },
      {
        title: "DAY 6 — PULL DAY",
        warmup: [
          "Elliptical — 15-20 min",
          "Shoulder Circles — 30 sec each direction",
          "Band Pull-Aparts — 2 x 15",
          "Light Seated Row — 1 x 15",
          "Light Lat Pulldown — 1 x 15",
          "Light Hammer Curls — 1 x 15"
        ],
        supersets: [
          ["Back + Biceps", ["Assisted Pullups / Lat Pulldown — 4 x 8-12", "Dumbbell Curls — 4 x 10-12"]],
          ["Back + Biceps", ["Seated Cable Row — 4 x 10-12", "Reverse Curls — 4 x 10-12"]],
          ["Back + Rear Delts", ["Single-Arm Cable Row — 4 x 10 each side", "Cable Face Pulls — 4 x 12-15"]],
          ["Abs + Grip", ["Hanging Knee Raises — 4 x 10-15", "Farmer Carries — 4 x 25-35 sec"]]
        ],
        cooldown: [
          "Bike — 5-8 min easy pace",
          "Lat Stretch — 45 sec each side",
          "Rear Delt Stretch — 45 sec each side",
          "Forearm Stretch — 30 sec each side",
          "Breathing Reset — 1 min"
        ]
      },
      {
        title: "DAY 7 — LEGS + CONDITIONING",
        warmup: [
          "Bike — 15-20 min",
          "Hip Circles — 30 sec each direction",
          "Knee Hugs — 1 x 10 each side",
          "Bodyweight Squats — 2 x 12",
          "Walking Lunges — 1 x 8 each leg",
          "Light Leg Extension — 1 x 15"
        ],
        supersets: [
          ["Upper Legs", ["Leg Press — 4 x 10-15", "Seated Hamstring Curl — 4 x 10-15"]],
          ["Upper Legs", ["Dumbbell Walking Lunges — 4 x 8 each leg", "Leg Extension Machine — 4 x 12-15"]],
          ["Lower Legs + Abs", ["Seated Calf Raises — 4 x 15-20", "Machine Crunch — 4 x 12-15"]],
          ["Conditioning", ["Sled Push / Stairmaster — 4 x 30-45 sec", "Plank — 4 x 30-45 sec"]]
        ],
        cooldown: [
          "Treadmill Walk — 5-10 min easy pace",
          "Quad Stretch — 45 sec each side",
          "Hamstring Stretch — 45 sec each side",
          "Calf Stretch — 45 sec each side",
          "Figure-4 Glute Stretch — 45 sec each side",
          "Deep Breathing — 1 min"
        ]
      },
      {
        title: "DAY 8 — MIXED UPPER BODY",
        warmup: [
          "Treadmill or Elliptical — 15-20 min",
          "Arm Circles — 30 sec each direction",
          "Band Pull-Aparts — 2 x 15",
          "Incline Pushups — 2 x 8-10",
          "Light Lat Pulldown — 1 x 15",
          "Light Cable Face Pull — 1 x 15"
        ],
        supersets: [
          ["Chest + Back", ["Machine Chest Press — 4 x 10-12", "Wide-Grip Lat Pulldown — 4 x 10-12"]],
          ["Chest + Back", ["Incline Dumbbell Press — 4 x 10-12", "Chest-Supported Row Machine — 4 x 10-12"]],
          ["Shoulders + Arms", ["Machine Lateral Raise — 4 x 12-15", "EZ-Bar Curls — 4 x 10-12"]],
          ["Arms + Abs", ["Cable Tricep Pushdown — 4 x 12-15", "Cable Crunch — 4 x 12-15"]],
          ["Fitness Finish", ["Bike Moderate Push — 4 x 60 sec", "Dead Bug — 4 x 10 each side"]]
        ],
        cooldown: [
          "Elliptical — 5-8 min easy pace",
          "Chest Stretch — 45 sec each side",
          "Lat Stretch — 45 sec each side",
          "Shoulder Stretch — 45 sec each side",
          "Hamstring Stretch — 45 sec each side",
          "Deep Breathing — 1-2 min"
        ]
      }
    ];

    const tabs = document.getElementById("tabs");
    const app = document.getElementById("app");

    workouts.forEach((workout, index) => {
      const button = document.createElement("button");
      button.textContent = "Day " + (index + 1);
      if (index === 0) button.classList.add("active");
      button.onclick = () => showDay(index);
      tabs.appendChild(button);

      const section = document.createElement("section");
      section.className = "day" + (index === 0 ? " active" : "");

      section.innerHTML = `
        <h2 class="day-title">${workout.title}</h2>

        <div class="cooldown">
          <h3>Warmup</h3>
          <ul>${workout.warmup.map(item => `<li>${item}</li>`).join("")}</ul>
        </div>

        ${workout.supersets.map((superset, supersetIndex) => `
          <details>
            <summary>Superset ${supersetIndex + 1} — ${superset[0]}</summary>
            <div class="content">
              ${superset[1].map(exercise => {
                const parts = exercise.split(" — ");
                return `
                  <div class="exercise">
                    <div class="exercise-name">${parts[0]}</div>
                    <div class="sets">${parts[1] || ""}</div>
                  </div>
                `;
              }).join("")}
            </div>
          </details>
        `).join("")}

        <div class="cooldown">
          <h3>Cooldown</h3>
          <ul>${workout.cooldown.map(item => `<li>${item}</li>`).join("")}</ul>
        </div>
      `;

      app.appendChild(section);
    });

    function showDay(index) {
      document.querySelectorAll(".day").forEach((day, i) => {
        day.classList.toggle("active", i === index);
      });

      document.querySelectorAll(".tabs button").forEach((button, i) => {
        button.classList.toggle("active", i === index);
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  </script>
</body>
</html>
